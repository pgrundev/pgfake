name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # zero dependencies, nothing to cache
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Zero dependencies
        run: test ! -e go.sum && test "$(go list -m all | wc -l)" -eq 1
      - name: Fuzz (short)
        run: go test -run='^$' -fuzz='^FuzzTransform$' -fuzztime=20s .
